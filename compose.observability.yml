name: clef-observability

services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    environment:
      JAEGER_LISTEN_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/status"]
      interval: 2s
      timeout: 2s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    depends_on:
      jaeger:
        condition: service_healthy

  app:
    image: clef-mock:local
    environment:
      - CLEF_MOCK_MODEL=1
      - MODEL=clef
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_BSP_SCHEDULE_DELAY=100
      - LOG_LEVEL=INFO
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - otel-collector
